<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RISC-V RV32GC Simulator & Assembler</title>
<style>
/* General Reset & Layout */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Consolas', 'Courier New', monospace; background: #1e1e2e; color: #e9ebf8; height: 100vh; overflow: hidden; }
.container { display: flex; flex-direction: column; height: 100vh; }

/* Header */
.header { background: #232536; padding: 8px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #3e4158; }
.header h1 { font-size: 18px; color: #d2bbff; font-weight: 600; }
.header .subtitle { font-size: 13px; color: #9aa3c4; }

/* Main Layout */
.main { display: flex; flex: 1; overflow: hidden; }
.left-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.right-panel { width: 380px; display: flex; flex-direction: column; border-left: 1px solid #3e4158; min-width: 0; }

/* Editor */
.editor-container { position: relative; flex: 1; overflow: hidden; }
.editor-container textarea, .editor-container .highlight-layer {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  padding: 12px; font-family: 'Consolas', 'Courier New', monospace;
  font-size: 13px; line-height: 1.5; tab-size: 4; white-space: pre; overflow: auto;
  border: none; outline: none; resize: none;
}
.editor-container textarea {
  color: transparent;
  -webkit-text-fill-color: transparent;
  background: transparent;
  caret-color: #ffe08f;
  z-index: 2;
  text-shadow: none;
}
.editor-container textarea::selection {
  background: rgba(157, 195, 255, 0.45);
}
.editor-container .highlight-layer {
  display: block;
  z-index: 1;
  color: #e9ebf8;
  background: #1e1e2e;
  pointer-events: none;
  overflow: hidden;
}
.editor-container .highlight-layer::selection {
  background: transparent;
}

/* Toolbar */
.toolbar { display: flex; gap: 6px; padding: 6px 12px; background: #232536; border-bottom: 1px solid #3e4158; flex-wrap: wrap; align-items: center; }
.toolbar button {
  background: #3e4158; color: #e9ebf8; border: none; padding: 6px 12px;
  font-size: 14px; cursor: pointer; border-radius: 4px; font-family: inherit;
  transition: background 0.15s;
}
.toolbar button:hover { background: #565c87; }
.toolbar button.primary { background: #d2bbff; color: #1e1e2e; font-weight: 600; }
.toolbar button.primary:hover { background: #b4befe; }
.toolbar button.danger { background: #ff9ab0; color: #1e1e2e; }
.toolbar button.danger:hover { background: #eba0ac; }
.toolbar .sep { width: 1px; height: 24px; background: #3e4158; margin: 0 4px; }
.toolbar .status { font-size: 13px; color: #c4cae4; margin-left: auto; }
.toolbar #fileLoader { display: none; }

/* Right Panel Tabs */
.tab-bar { display: flex; background: #232536; border-bottom: 1px solid #3e4158; }
.tab-bar button {
  flex: 1; background: none; border: none; color: #9aa3c4; padding: 8px 0;
  font-size: 14px; cursor: pointer; font-family: inherit; border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.tab-bar button:hover { color: #e9ebf8; }
.tab-bar button.active { color: #d2bbff; border-bottom-color: #d2bbff; }

.tab-content { flex: 1; overflow: auto; display: none; padding: 8px; }
.tab-content.active { display: block; }

/* Register Table */
.reg-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.reg-table th { text-align: left; padding: 4px 8px; color: #9aa3c4; font-weight: 500; border-bottom: 1px solid #3e4158; position: sticky; top: 0; background: #1e1e2e; }
.reg-table td { padding: 3px 8px; border-bottom: 1px solid #232536; }
.reg-table tr:hover td { background: #232536; }
.reg-table .reg-name { color: #9dc3ff; }
.reg-table .reg-val { color: #b6efb2; text-align: right; font-variant-numeric: tabular-nums; }
.reg-table .reg-changed { color: #ffe08f; }

/* Memory View */
.mem-toolbar { display: flex; gap: 4px; margin-bottom: 6px; align-items: center; }
.mem-toolbar input { background: #3e4158; border: 1px solid #565c87; color: #e9ebf8; padding: 4px 6px; font-size: 13px; font-family: inherit; width: 100px; border-radius: 3px; }
.mem-toolbar button { background: #3e4158; border: none; color: #e9ebf8; padding: 4px 8px; font-size: 13px; cursor: pointer; border-radius: 3px; font-family: inherit; }
.mem-toolbar button:hover { background: #565c87; }
.mem-view { font-size: 13px; line-height: 1.6; }
.mem-view .addr { color: #9aa3c4; }
.mem-view .val { color: #f7c8e8; }
.mem-view .ascii { color: #8fd4f6; }
.mem-view .changed { color: #ffe08f; font-weight: bold; }

/* Console */
.console { background: #171826; padding: 6px 8px; font-size: 13px; border-top: 1px solid #3e4158; max-height: 120px; overflow: auto; min-height: 40px; }
.console .error { color: #ff9ab0; }
.console .info { color: #9dc3ff; }
.console .success { color: #b6efb2; }
.console .warn { color: #ffe08f; }

/* Line numbers */
.editor-wrapper { position: relative; flex: 1; overflow: hidden; display: flex; }
.line-numbers { background: #232536; color: #9aa3c4; padding: 12px 6px; text-align: right; font-size: 14px; line-height: 19.5px; min-width: 40px; overflow: hidden; user-select: none; font-family: 'Consolas', 'Courier New', monospace; white-space: pre; }
.code-area { position: relative; flex: 1; overflow: hidden; display: flex; flex-direction: column; }

/* Syntax highlighting colors */
.hl-comment { color: #9aa3c4; font-style: italic; }
.hl-directive { color: #f7c8e8; }
.hl-label { color: #fcc28f; }
.hl-instruction { color: #9dc3ff; }
.hl-register { color: #b6efb2; }
.hl-number { color: #ffe08f; }
.hl-string { color: #b6efb2; }
.hl-punctuation { color: #e9ebf8; }
.hl-keyword { color: #d2bbff; }

/* Cycle badge & toolbar controls */
.cycle-badge { font-size: 13px; color: #b6efb2; background: #16231a; border: 1px solid #2f4a33; padding: 3px 10px; border-radius: 12px; font-weight: 600; white-space: nowrap; }
.cycle-badge b { color: #ffe08f; }
.toolbar .run-btn { background: #b6efb2; color: #11151a; font-weight: 700; }
.toolbar .run-btn:hover { background: #b4f2b4; }
.toolbar .stop-btn { background: #ff9ab0; color: #1e1e2e; font-weight: 700; }
.toolbar .stop-btn:hover { background: #eda0b5; }
.toolbar .gear { background: #565c87; }
.toolbar .gear:hover { background: #585b70; }

/* Line-number gutter (breakpoints + current-PC) */
.line-numbers .ln { display: flex; align-items: center; height: 19.5px; cursor: pointer; padding: 0 6px 0 2px; }
.line-numbers .ln-bp, .line-numbers .ln-pc { width: 14px; flex: none; font-size: 11px; line-height: 19.5px; }
.line-numbers .ln-num { width: 24px; flex: none; text-align: right; }
.line-numbers .ln-bp { color: transparent; }
.line-numbers .ln-break .ln-bp { color: #ff9ab0; text-shadow: 0 0 5px #ff9ab0; }
.line-numbers .ln-current { background: rgba(203,166,247,0.12); border-left: 2px solid #d2bbff; }
.line-numbers .ln-current .ln-num { color: #d2bbff; font-weight: 700; }
.line-numbers .ln-current .ln-pc { color: #d2bbff; }
.line-numbers .ln:hover { background: rgba(137,180,250,0.08); }

/* Cycle configuration overlay */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
.cycle-panel { background: #1e1e2e; border: 1px solid #565c87; border-radius: 10px; width: min(680px, 94vw); max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 12px 44px rgba(0,0,0,0.55); }
.cycle-panel .c-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #3e4158; font-size: 16px; font-weight: 600; color: #d2bbff; }
.cycle-panel .c-head button { background: none; border: none; color: #c4cae4; font-size: 18px; cursor: pointer; }
.cycle-panel .c-head button:hover { color: #ff9ab0; }
.cycle-panel .c-body { padding: 12px 16px; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.cycle-field label { display: block; font-size: 12px; color: #c4cae4; margin-bottom: 3px; }
.cycle-field input { width: 100%; background: #3e4158; border: 1px solid #565c87; color: #e9ebf8; padding: 5px 8px; font-size: 13px; border-radius: 5px; }
.cycle-field input:focus { outline: none; border-color: 
#d2bbff; }
.cycle-panel .c-foot { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-top: 1px solid #3e4158; gap: 8px; }
.cycle-panel .c-foot button { background: #3e4158; color: #e9ebf8; border: none; padding: 6px 14px; border-radius: 5px; cursor: pointer; font-size: 13px; }
.cycle-panel .c-foot button:hover { background: #565c87; }
.cycle-panel .c-foot button.primary { background: #d2bbff; color: #1e1e2e; font-weight: 600; }
.cycle-hint { grid-column: 1 / -1; font-size: 11px; color: #9aa3c4; }

/* Memory view enhancements */
.mem-view { white-space: pre; }
.mem-view .val { display: inline-block; width: 18px; text-align: center; }
.mem-view .ascii { display: inline-block; width: 9px; text-align: center; }
.wordgap { display: inline-block; width: 12px; }
.mem-label { color: #d2bbff; font-weight: 600; margin-left: 6px; }
.mem-legend { font-size: 11px; color: #9aa3c4; margin-bottom: 6px; }
.mem-legend .changed { color: #ffe08f; }

/* Error line markers in gutter */
.line-numbers .ln-error { background: rgba(255,154,176,0.10); }
.line-numbers .ln-error .ln-num { color: #ff9ab0; }

/* Responsive */
@media (max-width: 800px) {
  .main { flex-direction: column; }
  .right-panel { width: 100%; border-left: none; border-top: 1px solid #3e4158; max-height: 300px; }
  .toolbar { font-size: 12px; }
}

/* Scrollbar styling */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #1e1e2e; }
::-webkit-scrollbar-thumb { background: #565c87; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #585b70; }
</style>
</head>
<body id="simulatorBody">
<div class="container">
  <div class="header">
    <h1>🦾 RISC-V Simulator</h1>
    <span class="subtitle">RV32GC — Assembler + Simulator</span>
  </div>
  <div class="toolbar">
    <input type="file" id="fileLoader" accept=".asm,.s,.txt" onchange="loadFile(event)">
    <button onclick="document.getElementById('fileLoader').click()">📂 Open</button>
    <button class="run-btn" id="runBtn" onclick="runProgram()" title="Run from the start. Click a line number in the left gutter to toggle a breakpoint.">▶ Run</button>
    <button class="stop-btn" id="stopBtn" onclick="stopProgram()" style="display:none;">▪ Stop</button>
    <button onclick="stepOnce()">⏭ Step</button>
    <button onclick="resetAll()"> Reset</button>
    <span class="sep"></span>
    <button onclick="loadExample('basic')">Basic</button>
    <button onclick="loadExample('fib')">Fib</button>
    <button onclick="loadExample('fact')">Factorial</button>
    <button onclick="loadExample('loop')">Loop</button>
    <button onclick="loadExample('io')">I/O Demo</button>
    <span class="sep"></span>
    <button class="gear" onclick="toggleCyclesPanel()" title="Configure how many cycles each instruction class consumes">⏱ Cycles…</button>
    <span class="cycle-badge" id="cycleBadge" title="Cycles taken so far">⏱ <b>0</b> cycles</span>
    <span class="status" id="statusBar">Ready</span>
  </div>
  <div class="main">
    <div class="left-panel">
      <div class="editor-wrapper">
        <div class="line-numbers" id="lineNumbers">1</div>
        <div class="code-area">
          <div class="editor-container">
            <div class="highlight-layer" id="highlightLayer"></div>
            <textarea id="asmEditor" spellcheck="false" onscroll="syncScroll()" oninput="updateEditor()" placeholder="Write RISC-V assembly here..."></textarea>
          </div>
        </div>
      </div>
      <div class="console" id="console"></div>
    </div>
    <div class="right-panel">
      <div class="tab-bar">
        <button class="active" onclick="switchTab('registers',this)">Registers</button>
        <button onclick="switchTab('memory',this)">Memory</button>
        <button onclick="switchTab('machine',this)">Machine</button>
      </div>
      <div class="tab-content active" id="tab-registers">
        <table class="reg-table" id="regTable">
          <thead><tr><th id="regId">#</th><th id="regName">Name</th><th id="regHex">Value (Hex)</th><th id="regDec">Value (Dec)</th></tr></thead>
          <tbody id="regBody"></tbody>
        </table>
      </div>
      <div class="tab-content" id="tab-memory">
        <div class="mem-toolbar">
          <span style="color:#9aa3c4;font-size:13px;">Addr</span>
          <input type="text" id="memAddr" value="0x10000" onchange="updateMemoryView()" onkeydown="if(event.key==='Enter')updateMemoryView()">
          <span style="color:#9aa3c4;font-size:13px;">Rows</span>
          <input type="number" id="memRows" value="16" min="1" max="64" style="width:50px;" onchange="updateMemoryView()">
          <button onclick="memGo('code')" title="Program / code segment">Code</button>
          <button onclick="memGo('data')" title="Data / static segment (writes land here)">Data</button>
          <button onclick="memGo('stack')" title="Stack region near the stack pointer">Stack</button>
          <button onclick="memGo('mmio')" title="Memory-mapped I/O region">MMIO</button>
        </div>
        <div class="mem-legend">
          groups of 4 bytes = one 32-bit word &nbsp;·&nbsp; <span style="color:#d2bbff">label</span> = symbol at row &nbsp;·&nbsp;
          <span class="changed">highlighted bytes</span> were written at runtime
        </div>
        <div class="mem-view" id="memView"></div>
      </div>
      <div class="tab-content" id="tab-machine">
        <div style="font-size:13px;margin-bottom:6px;color:#9aa3c4;">
          <label><input type="checkbox" id="showHex" checked onchange="updateMachineCode()"> Show Hex</label>
          <label style="margin-left:8px;"><input type="checkbox" id="showBinary" onchange="updateMachineCode()"> Show Binary</label>
        </div>
        <div id="machineCodeDisplay" style="font-size:13px;line-height:1.6;"></div>
      </div>
    </div>
  </div>
</div >

<!-- Cycle configuration overlay -->
<div class="overlay" id="cyclesOverlay" style="display:none;">
  <div class="cycle-panel">
    <div class="c-head">
      <span>⏱ Cycle Configuration <span style="font-size:12px;color:#9aa3c4;font-weight:400;margin-left:6px;">cycles consumed per instruction class</span></span>
      <button onclick="closeCyclesPanel()" title="Close">&times;</button>
    </div>
    <div class="c-body" id="cyclesConfigBody"></div>
    <div class="c-foot">
      <button onclick="resetCyclesConfig()">Reset Defaults</button>
      <button class="primary" onclick="closeCyclesPanel()">Done</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 1. RISC-V RV32GC INSTRUCTION SET DEFINITIONS
// ============================================================

const INSTRUCTIONS = {
  // RV32I Base Integer Instructions
  'lui':    { type: 'U', opcode: 0b0110111, funct3: 0 },
  'auipc':  { type: 'U', opcode: 0b0010111, funct3: 0 },
  'jal':    { type: 'J', opcode: 0b1101111, funct3: 0 },
  'jalr':   { type: 'I', opcode: 0b1100111, funct3: 0 },

  'lh':     { type: 'I', opcode: 0b0000011, funct3: 0b001 },
  'lw':     { type: 'I', opcode: 0b0000011, funct3: 0b010 },
  'lbu':    { type: 'I', opcode: 0b0000011, funct3: 0b100 },
  'lhu':    { type: 'I', opcode: 0b0000011, funct3: 0b101 },
  'sb':     { type: 'S', opcode: 0b0100011, funct3: 0b000 },
  'sh':     { type: 'S', opcode: 0b0100011, funct3: 0b001 },
  'sw':     { type: 'S', opcode: 0b0100011, funct3: 0b010 },
  'addi':   { type: 'I', opcode: 0b0010011, funct3: 0b000 },
  'slti':   { type: 'I', opcode: 0b0010011, funct3: 0b010 },
  'sltiu':  { type: 'I', opcode: 0b0010011, funct3: 0b011 },
  'xori':   { type: 'I', opcode: 0b0010011, funct3: 0b100 },
  'ori':    { type: 'I', opcode: 0b0010011, funct3: 0b110 },
  'andi':   { type: 'I', opcode: 0b0010011, funct3: 0b111 },

  'slt':    { type: 'R', opcode: 0b0110011, funct3: 0b010, funct7: 0b0000000 },
  'sltu':   { type: 'R', opcode: 0b0110011, funct3: 0b011, funct7: 0b0000000 },

  // RV64I additions (we keep them for compatibility but they work as RV32I)
  'addiw':  { type: 'I', opcode: 0b0011011, funct3: 0b000 },

  'fsgnj.s':{ type: 'R', opcode: 0b1010011, funct3: 0b000, funct7: 0b0010000 },
  'fsgnjn.s':{type: 'R', opcode: 0b1010011, funct3: 0b001, funct7: 0b0010000 },
  'fsgnjx.s':{type: 'R', opcode: 0b1010011, funct3: 0b010, funct7: 0b0010000 },

  'seqz':   ['sltiu %0, %1, 1'],
  'snez':   ['sltiu %0, x0, %(1)'],
  'sltz':   ['slt %0, %1, x0'],
  'sgtz':   ['slt %0, x0, %1'],
  'beqz':   ['beq %0, x0, %2'],
  'bnez':   ['bne %0, x0, %2'],
  'blez':   ['bge x0, %0, %2'],
  'bgez':   ['bge %0, x0, %2'],
  'bltz':   ['blt %0, x0, %2'],
  'bgtz':   ['blt x0, %0, %2'],
  'bgt':    ['blt %1, %0, %2'],
  'ble':    ['bge %1, %0, %2'],
  'bgtu':   ['bltu %1, %0, %2'],
  'bleu':   ['bgeu %1, %0, %2'],
  'j':      ['jal x0, %0'],
  'jal':    ['jal %0, %1'],
  'jr':     ['jalr x0, %0, 0'],
  'ret':    ['jalr x0, x1, 0'],
  'call':   ['auipc x6, %0', 'jalr x1, x6, %1'],
  'tail':   ['auipc x6, %0', 'jalr x0, x6, %1'],
  'li':     function(rd, imm) {
    imm = Number(imm);
    if (imm >= -2048 && imm <= 2047) return [`addi ${rd}, x0, ${imm}`];
    let upper = imm >>> 12;
    let lower = imm & 0xFFF;
    if (lower & 0x800) {
      upper = (upper + 1) & 0xFFFFF;
    }
    const signExtended = (lower & 0x800) ? (lower | ~0x7FF) : lower;
    return [`lui ${rd}, ${upper}`, `addi ${rd}, ${rd}, ${signExtended}`];
  }
};

// ============================================================
// 3. REGISTER UTILITIES
// ============================================================

function parseReg(s) {
  s = s.toLowerCase().replace(/,/g,' ').trim();
  if (s.startsWith('x')) {
    const n = parseInt(s.substring(1), 10);
    if (n >= 0 && n <= 31) return n;
  }
  if (s.startsWith('f')) {
    const n = parseInt(s.substring(1), 10);
    if (n >= 0 && n <= 31) return n;
  }
  if (REG_NAMES[s] !== undefined) return parseInt(REG_NAMES[s].substring(1), 10);
  return -1;
}

function parseFReg(s) {
  s = s.toLowerCase().replace(/,/g,' ').trim();
  if (s.startsWith('f')) {
    const n = parseInt(s.substring(1), 10);
    if (n >= 0 && n <= 31) return n;
  }
  return -1;
}

function parseImm(s) {
  s = s.trim().replace(/,/g,'');
  if (s.startsWith('0x') || s.startsWith('0X')) return parseInt(s, 16);
  if (s.startsWith('-0x') || s.startsWith('-0X')) return -parseInt(s.substring(1), 16);
  return parseInt(s, 10);
}

function parseMemOp(s) {
  // Formats: "offset(reg)" or "reg"
  s = s.trim();
  const m = s.match(/^(-?(?:0x[0-9a-fA-F]+|\d+))\s*\(\s*(x\d+|f\d+|\w+)\s*\)$/i);
  if (m) {
    const offsetStr = m[1];
    const offset = parseImm(offsetStr);
    const reg = parseReg(m[2]);
    return { offset, reg };
  }
  const reg = parseReg(s);
  if (reg >= 0 && reg <= 31) return { offset: 0, reg };
  return null;
}

function sext(value, bits) {
  const sign = 1 << (bits - 1);
  return (value & (sign - 1)) - (value & sign);
}

// ============================================================
// 4. ASSEMBLER
// ============================================================

function assemble(source) {
  const lines = source.split('\n');
  const output = [];
  labels = {};
  let address = 0x10000;
  
  // First pass: collect labels and compute addresses
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];
    const commentIdx = line.indexOf('#');
    if (commentIdx >= 0) line = line.substring(0, commentIdx);
    line = line.trim();
    if (!line) continue;
    
    if (line.endsWith(':')) {
      const label = line.substring(0, line.length - 1);
      labels[label] = address;
      continue;
    }
    
    const parts = line.split(/\s+/);
    const mnemonic = parts[0].toLowerCase();
    if (PSEUDO_INSTRUCTIONS[mnemonic]) continue;
    if (INSTRUCTIONS[mnemonic]) {
      address += 4;
    } else if (mnemonic === '.word') {
      address += 4;
    } else if (mnemonic === '.byte') {
      address += 1;
    } else if (mnemonic === '.half') {
      address += 2;
    } else if (mnemonic === '.space') {
      if (parts[1]) address += parseInt(parts[1], 10) || 0;
    } else if (mnemonic === '.asciiz') {
      const str = line.substring(line.indexOf(' ')).trim();
      const strVal = parseStringLiteral(str);
      address += strVal.length + 1;
    } else if (mnemonic === '.asciz' || mnemonic === '.ascii') {
      const str = line.substring(line.indexOf(' ')).trim();
      const strVal = parseStringLiteral(str);
      address += mnemonic === '.ascii' ? strVal.length : strVal.length + 1;
    } else if (mnemonic === '.align') {
      const align = parseInt(parts[1], 10);
      if (align > 0) address = (address + (1 << align) - 1) & ~((1 << align) - 1);
    }
  }

  // Second pass: expand pseudo-instructions and encode
  address = 0x10000;
  let expandedLines = [];
  
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];
    const commentIdx = line.indexOf('#');
    let comment = '';
    if (commentIdx >= 0) {
      comment = line.substring(commentIdx);
      line = line.substring(0, commentIdx);
    }
    const origLine = line.trim();
    if (!origLine) {
      expandedLines.push({ text: '', line: i, comment: '' });
      continue;
    }
    if (origLine.endsWith(':')) {
      expandedLines.push({ text: origLine, line: i, comment: '' });
      continue;
    }
    const parts = origLine.split(/\s+/);
    const mnemonic = parts[0].toLowerCase();
    const args = parts.slice(1).join(' ').split(',').map(s => s.trim()).filter(s => s);
    
    if (PSEUDO_INSTRUCTIONS[mnemonic]) {
      let exp;
      if (typeof PSEUDO_INSTRUCTIONS[mnemonic] === 'function') {
        exp = PSEUDO_INSTRUCTIONS[mnemonic](...args);
      } else {
        exp = PSEUDO_INSTRUCTIONS[mnemonic].map(t => {
          let s = t;
          s = s.replace(/%(\d+)/g, (m, idx) => args[parseInt(idx)] || '');
          return s;
        });
      }
      if (exp) {
        for (const e of exp) {
          const ec = e.indexOf('#');
          let etext = ec >= 0 ? e.substring(0, ec).trim() : e.trim();
          if (etext) expandedLines.push({ text: etext, line: i, comment: '' });
        }
      }
    } else {
      expandedLines.push({ text: origLine, line: i, comment });
    }
  }

  // Third pass: encode instructions
  for (let i = 0; i < expandedLines.length; i++) {
    const { text, line, comment } = expandedLines[i];
    if (!text || text.endsWith(':')) continue;
    
    const parts = text.split(/\s+/);
    const mnemonic = parts[0].toLowerCase();
    const args = parts.slice(1).join(' ').split(',').map(s => s.trim()).filter(s => s);
    
    if (INSTRUCTIONS[mnemonic]) {
      const instr = INSTRUCTIONS[mnemonic];
      try {
        let encoding = encodeInstruction(mnemonic, args, address);
        if (encoding !== null) {
          output.push({
            address,
            bytes: encoding,
            text: text + (comment ? ' ' + comment : ''),
            line: line + 1,
            asmLine: text
          });
          address += 4;
        } else {
          output.push({
            address,
            bytes: null,
            text: text + (comment ? ' ' + comment : ''),
            line: line + 1,
            error: 'Encoding failed',
            asmLine: text
          });
          address += 4;
        }
      } catch (e) {
        output.push({
          address,
          bytes: null,
          text: text + (comment ? ' ' + comment : ''),
          line: line + 1,
          error: e.message,
          asmLine: text
        });
        address += 4;
      }
    } else if (mnemonic === '.word') {
      const val = parseImm(text.substring(5));
      if (!isNaN(val)) {
        output.push({
          address,
          bytes: [val & 0xFF, (val >> 8) & 0xFF, (val >> 16) & 0xFF, (val >> 24) & 0xFF],
          text: text + (comment ? ' ' + comment : ''),
          line: line + 1,
          asmLine: text
        });
        address += 4;
      }
    } else if (mnemonic === '.half') {
      const val = parseImm(text.substring(5));
      if (!isNaN(val)) {
        output.push({
          address,
          bytes: [val & 0xFF, (val >> 8) & 0xFF],
          text: text + (comment ? ' ' + comment : ''),
          line: line + 1,
          asmLine: text
        });
        address += 2;
      }
    } else if (mnemonic === '.byte') {
      const val = parseImm(text.substring(5));
      if (!isNaN(val)) {
        output.push({
          address,
          bytes: [val & 0xFF],
          text: text + (comment ? ' ' + comment : ''),
          line: line + 1,
          asmLine: text
        });
        address += 1;
      }
    } else if (mnemonic === '.space') {
      const size = parseInt(args[0], 10) || 0;
      output.push({
        address,
        bytes: new Array(size).fill(0),
        text: text + (comment ? ' ' + comment : ''),
        line: line + 1,
        asmLine: text
      });
      address += size;
    } else if (mnemonic === '.asciiz' || mnemonic === '.asciz' || mnemonic === '.ascii') {
      const str = text.substring(text.indexOf(' ')).trim();
      const strVal = parseStringLiteral(str);
      const bytes = [];
      for (let c = 0; c < strVal.length; c++) bytes.push(strVal.charCodeAt(c) & 0xFF);
      if (mnemonic !== '.ascii') bytes.push(0);
      output.push({
        address,
        bytes: bytes,
        text: text + (comment ? ' ' + comment : ''),
        line: line + 1,
        asmLine: text
      });
      address += bytes.length;
    } else if (mnemonic === '.align') {
      const align = parseInt(args[0], 10);
      if (align > 0) {
        const newAddr = (address + (1 << align) - 1) & ~((1 << align) - 1);
        const padding = new Array(newAddr - address).fill(0);
        if (padding.length > 0) {
          output.push({
            address,
            bytes: padding,
            text: text + (comment ? ' ' + comment : ''),
            line: line + 1,
            asmLine: text
          });
        }
        address = newAddr;
      }
    } else if (/^\./.test(mnemonic)) {
      // Directive we don't encode (.text, .data, .globl, ...): skip silently.
    } else {
      output.push({
        address,
        bytes: null,
        text: text + (comment ? ' ' + comment : ''),
        line: line + 1,
        error: `Unknown instruction or pseudo-op "${mnemonic}"`,
        asmLine: text
      });
      address += 4;
    }
  }
  
  return output;
}

function parseStringLiteral(s) {
  s = s.trim();
  if ((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) {
    s = s.substring(1, s.length - 1);
  }
  let result = '';
  for (let i = 0; i < s.length; i++) {
    if (s[i] === '\\' && i + 1 < s.length) {
      switch (s[i+1]) {
        case 'n': result += '\n'; break;
        case 't': result += '\t'; break;
        case 'r': result += '\r'; break;
        case '0': result += '\0'; break;
        case '\\': result += '\\'; break;
        case '"': result += '"'; break;
        case "'": result += "'"; break;
        default: result += s[i+1];
      }
      i++;
    } else {
      result += s[i];
    }
  }
  return result;
}

function encodeInstruction(mnemonic, args, address) {
  const instr = INSTRUCTIONS[mnemonic];
  if (!instr) return null;
  
  let encoding = 0;
  
  switch (instr.type) {
    case 'R': {
      let rd = 0, rs1 = 0, rs2 = 0;
      
      if (['fadd.s','fsub.s','fmul.s','fdiv.s','fsqrt.s','fsgnj.s','fsgnjn.s','fsgnjx.s',
           'fmin.s','fmax.s','feq.s','flt.s','fle.s','fclass.s',
           'fcvt.w.s','fcvt.wu.s','fmv.x.w','fcvt.s.w','fcvt.s.wu','fmv.w.x',
           'fadd.d','fsub.d','fmul.d','fdiv.d','fsqrt.d','fsgnj.d','fsgnjn.d','fsgnjx.d',
           'fmin.d','fmax.d','feq.d','flt.d','fle.d','fclass.d',
           'fcvt.s.d','fcvt.d.s',
           'mul','mulh','mulhsu','mulhu','div','divu','rem','remu',
           'add','sub','sll','slt','sltu','xor','srl','sra','or','and',
           'addw','subw','sllw','srlw','sraw',
           'lr.w','sc.w',
           'amoswap.w','amoadd.w','amoxor.w','amoand.w','amoor.w',
           'amomin.w','amomax.w','amominu.w','amomaxu.w'].includes(mnemonic)) {
        if (['fcvt.w.s','fcvt.wu.s','fmv.x.w','fclass.s',
             'fcvt.w.d','fcvt.wu.d','fmv.x.d','fclass.d'].includes(mnemonic)) {
          rd = parseReg(args[0]);
          rs1 = parseFReg(args[1]);
        } else if (['fcvt.s.w','fcvt.s.wu','fmv.w.x',
                     'fcvt.d.w','fcvt.d.wu','fmv.d.x',
                     'fsqrt.s','fsqrt.d'].includes(mnemonic)) {
          rd = parseFReg(args[0]);
          rs1 = parseFReg(args[1]);
        } else if (['fcvt.s.d'].includes(mnemonic)) {
          rd = parseFReg(args[0]);
          rs1 = parseFReg(args[1]);
        } else if (['fcvt.d.s'].includes(mnemonic)) {
          rd = parseFReg(args[0]);
          rs1 = parseFReg(args[1]);
        } else if (['lr.w'].includes(mnemonic)) {
          rd = parseReg(args[0]);
          rs1 = parseReg(args[1]);
          rs2 = 0;
        } else if (['sc.w'].includes(mnemonic)) {
          rd = parseReg(args[0]);
          rs1 = parseReg(args[1]);
          rs2 = parseReg(args[2]);
        } else if (mnemonic.startsWith('amo')) {
          rd = parseReg(args[0]);
          rs1 = parseReg(args[1]);
          rs2 = parseReg(args[2]);
        } else if (mnemonic.startsWith('f') && !mnemonic.startsWith('fcv') && !mnemonic.startsWith('fm')) {
          if (args.length >= 3) {
            rd = parseFReg(args[0]);
            rs1 = parseFReg(args[1]);
            rs2 = parseFReg(args[2]);
          } else {
            rd = parseFReg(args[0]);
            rs1 = parseFReg(args[1]);
            rs2 = 0;
          }
        } else {
          rd = parseReg(args[0]);
          rs1 = parseReg(args[1]);
          rs2 = args.length >= 3 ? parseReg(args[2]) : 0;
        }
      }
      
      if (rd < 0 || rs1 < 0 || rs2 < 0) throw new Error(`Invalid register in ${mnemonic}`);
      
      encoding = (instr.funct7 << 25) | (rs2 << 20) | (rs1 << 15) | (instr.funct3 << 12) | (rd << 7) | instr.opcode;
      break;
    }
    
    case 'R4': {
      let rd = parseFReg(args[0]);
      let rs1 = parseFReg(args[1]);
      let rs2 = parseFReg(args[2]);
      let rs3 = parseFReg(args[3]);
      
      if (rd < 0 || rs1 < 0 || rs2 < 0 || rs3 < 0) throw new Error(`Invalid register in ${mnemonic}`);
      
      encoding = (instr.funct2 << 27) | (rs3 << 20) | (rs2 << 15) | (rs1 << 10) | (instr.funct3 << 7) | rd | (instr.opcode << 0);
      break;
    }
    
    case 'I': {
      let rd = 0, rs1 = 0, imm = 0;
      
      if (['lb','lh','lw','lbu','lhu','flw','fld'].includes(mnemonic)) {
        if (args.length >= 2) {
          rd = parseReg(args[0]);
          const mem = parseMemOp(args[1]);
          if (mem) {
            rs1 = mem.reg;
            imm = mem.offset;
          } else {
            rs1 = parseReg(args[1]);
            imm = args.length >= 3 ? parseImm(args[2]) : 0;
          }
        }
      } else if (['jalr'].includes(mnemonic)) {
        rd = parseReg(args[0]);
        if (args.length >= 2) {
          const mem = parseMemOp(args[1]);
          if (mem) {
            rs1 = mem.reg;
            imm = mem.offset;
          } else {
            rs1 = parseReg(args[1]);
            imm = args.length >= 3 ? parseImm(args[2]) : 0;
          }
        }
      } else if (['ecall','ebreak'].includes(mnemonic)) {
        rd = 0; rs1 = 0;
        imm = instr.imm12 || 0;
        if (mnemonic === 'ecall') {
          encoding = (0b000000000000 << 20) | (0b000 << 12) | (0b00000 << 7) | (0b1110011);
          return encoding;
        } else {
          encoding = (0b000000000001 << 20) | (0b000 << 12) | (0b00000 << 7) | (0b1110011);
          return encoding;
        }
      } else if (['addi','slti','sltiu','xori','ori','andi','addiw',
                   'slli','srli','srai','slliw','srliw','sraiw'].includes(mnemonic)) {
        rd = parseReg(args[0]);
        rs1 = parseReg(args[1]);
        imm = args.length >= 3 ? parseImm(args[2]) : 0;
        if (['slli','srli','srai','slliw','srliw','sraiw'].includes(mnemonic)) {
          imm = imm & 0x1F;
        }
      } else if (mnemonic === 'fence') {
        rd = 0; rs1 = 0; imm = 0;
      } else {
        rd = 0; rs1 = 0; imm = 0;
      }
      
      if (rd < 0 || rs1 < 0) throw new Error(`Invalid register in ${mnemonic}`);
      if (imm < -2048 || imm > 2047) throw new Error(`Immediate out of range: ${imm}`);
      
      const imm12 = imm & 0xFFF;
      
      if (['slli','srli','srai','slliw','srliw','sraiw'].includes(mnemonic)) {
        const funct7 = instr.funct7 || 0;
        const shamt = imm & 0x1F;
        encoding = (funct7 << 25) | (shamt << 20) | (rs1 << 15) | (instr.funct3 << 12) | (rd << 7) | instr.opcode;
      } else {
        encoding = (imm12 << 20) | (rs1 << 15) | (instr.funct3 << 12) | (rd << 7) | instr.opcode;
      }
      break;
    }
    
    case 'S': {
      let rs1 = 0, rs2 = 0, imm = 0;
      
      if (['sb','sh','sw','fsw','fsd'].includes(mnemonic)) {
        rs2 = parseReg(args[0]);
        if (args.length >= 2) {
          const mem = parseMemOp(args[1]);
          if (mem) {
            rs1 = mem.reg;
            imm = mem.offset;
          } else {
            rs1 = parseReg(args[1]);
            imm = args.length >= 3 ? parseImm(args[2]) : 0;
          }
        }
      }
      
      if (rs1 < 0 || rs2 < 0) throw new Error(`Invalid register in ${mnemonic}`);
      if (imm < -2048 || imm > 2047) throw new Error(`Immediate out of range: ${imm}`);
      
      const imm11_5 = (imm >> 5) & 0x7F;
      const imm4_0 = imm & 0x1F;
      encoding = (imm11_5 << 25) | (rs2 << 20) | (rs1 << 15) | (instr.funct3 << 12) | (imm4_0 << 7) | instr.opcode;
      break;
    }
    
    case 'B': {
      let rs1 = 0, rs2 = 0, imm = 0;
      
      rs1 = parseReg(args[0]);
      rs2 = parseReg(args[1]);
      
      const targetStr = args[2];
      let targetAddr;
      if (labels[targetStr] !== undefined) {
        targetAddr = labels[targetStr];
      } else {
        targetAddr = parseImm(targetStr);
        if (isNaN(targetAddr)) throw new Error(`Unknown label: ${targetStr}`);
      }
      
      imm = targetAddr - address;
      
      if (rs1 < 0 || rs2 < 0) throw new Error(`Invalid register in ${mnemonic}`);
      if (imm & 1) throw new Error(`Branch target not aligned: ${targetStr}`);
      if (imm < -4096 || imm > 4095) throw new Error(`Branch offset out of range: ${imm}`);
      
      const bit12 = (imm >> 12) & 1;
      const bit10_5 = (imm >> 5) & 0x3F;
      const bit4_1 = (imm >> 1) & 0xF;
      const bit11 = (imm >> 11) & 1;
      
      encoding = (bit12 << 31) | (bit10_5 << 25) | (rs2 << 20) | (rs1 << 15) | (instr.funct3 << 12) | 
                 (bit4_1 << 8) | (bit11 << 7) | instr.opcode;
      break;
    }
    
    case 'U': {
      let rd = parseReg(args[0]);
      let imm = args.length >= 2 ? parseImm(args[1]) : 0;
      
      if (rd < 0) throw new Error(`Invalid register in ${mnemonic}`);
      
      const uimm = (imm >> 12) & 0xFFFFF;
      encoding = (uimm << 12) | (rd << 7) | instr.opcode;
      break;
    }
    
    case 'J': {
      let rd = parseReg(args[0]);
      let targetStr = args[1];
      let targetAddr;
      
      if (labels[targetStr] !== undefined) {
        targetAddr = labels[targetStr];
      } else {
        targetAddr = parseImm(targetStr);
        if (isNaN(targetAddr)) throw new Error(`Unknown label: ${targetStr}`);
      }
      
      const imm = targetAddr - address;
      
      if (rd < 0) throw new Error(`Invalid register in ${mnemonic}`);
      if (imm & 1) throw new Error(`Jump target not aligned: ${targetStr}`);
      if (imm < -1048576 || imm > 1048575) throw new Error(`Jump offset out of range: ${imm}`);
      
      const bit20 = (imm >> 20) & 1;
      const bit10_1 = (imm >> 1) & 0x3FF;
      const bit11 = (imm >> 11) & 1;
      const bit19_12 = (imm >> 12) & 0xFF;
      
      encoding = (bit20 << 31) | (bit10_1 << 21) | (bit11 << 20) | (bit19_12 << 12) | (rd << 7) | instr.opcode;
      break;
    }
  }
  
  return [encoding & 0xFF, (encoding >> 8) & 0xFF, (encoding >> 16) & 0xFF, (encoding >> 24) & 0xFF];
}

// ============================================================
// 5. SIMULATOR
// ============================================================

function initializeState() {
  regs = new Int32Array(32);
  fregs = new Float32Array(32);
  dregs = new Float64Array(32);
  memory = new Uint8Array(4 * 1024 * 1024);
  pc = 0x10000;
  lastChangedReg = -1;
  lastChangedMem = [];
  ioInputBuffer = '';
  ioOutputBuffer = '';
  totalCycles = 0;
  regs[2] = 0x7FFFFC;
}

function loadProgram(mc) {
  initializeState();
  for (const item of mc) {
    if (item.bytes && !item.error) {
      const addr = item.address;
      for (let i = 0; i < item.bytes.length; i++) {
        if (addr + i < memory.length) {
          memory[addr + i] = item.bytes[i];
        }
      }
    }
  }
  pc = 0x10000;
}

function readMem(addr, size) {
  if (addr < 0 || addr + size > memory.length) return 0;
  let val = 0;
  for (let i = 0; i < size; i++) {
    val |= (memory[addr + i] << (i * 8));
  }
  return val;
}

function readMemSigned(addr, size) {
  let val = readMem(addr, size);
  const signBit = size * 8 - 1;
  if (val & (1 << signBit)) val -= (1 << (size * 8));
  return val;
}

function writeMem(addr, val, size) {
  if (addr < 0 || addr + size > memory.length) return;
  // Handle MMIO
  if (addr >= MMIO_BASE && addr < MMIO_BASE + 16) {
    handleMMIOWrite(addr, val, size);
    return;
  }
  for (let i = 0; i < size; i++) {
    memory[addr + i] = (val >> (i * 8)) & 0xFF;
  }
  lastChangedMem.push({ addr, size });
}

function handleMMIOWrite(addr, val, size) {
  if (addr === MMIO_PUTC) {
    const ch = val & 0xFF;
    if (ch >= 32 && ch <= 126) {
      ioOutputBuffer += String.fromCharCode(ch);
      log(ch === 10 ? '\n' : String.fromCharCode(ch), 'info');
    } else if (ch === 10 || ch === 13) {
      ioOutputBuffer += '\n';
      log('\n', 'info');
    }
  }
}

function handleMMIORead(addr, size) {
  if (addr === MMIO_GETC && ioInputBuffer.length > 0) {
    const ch = ioInputBuffer.charCodeAt(0);
    ioInputBuffer = ioInputBuffer.substring(1);
    return ch;
  }
  if (addr === MMIO_STATUS) {
    return ioInputBuffer.length > 0 ? 1 : 0;
  }
  return 0;
}

function fetchInstruction(addr) {
  return readMem(addr, 4);
}

function computeCycles(opcode, funct3, funct7) {
  const cfg = cycleConfig;
  switch (opcode) {
    case 0b0110111:                     // LUI
    case 0b0010111: return cfg.alu;     // AUIPC
    case 0b1101111:                     // JAL
    case 0b1100111: return cfg.jump;    // JALR
    case 0b0000011:                     // LOAD
    case 0b0000111: return cfg.load;    // LOAD FP
    case 0b0100011:                     // STORE
    case 0b0100111: return cfg.store;   // STORE FP
    case 0b0110011:                     // ALU reg / M-extension
      if (funct7 === 0b0000001) {
        if (funct3 >= 0b100) return cfg.div; // DIV DIVU REM REMU
        return cfg.mul;                       // MUL MULH MULHSU MULHU
      }
      return cfg.alu;
    case 0b0010011: return cfg.alu;     // ALU immediate
    case 0b1010011: return cfg.fp;      // FP ops
    case 0b0101111: return cfg.atomic;  // atomic AMO
    case 0b1110011: return cfg.system;  // ECALL / EBREAK
    default: return cfg.alu;
  }
}

function decodeAndExecute(instr32, addr) {
  const opcode = instr32 & 0x7F;
  const rd = (instr32 >> 7) & 0x1F;
  const funct3 = (instr32 >> 12) & 0x7;
  const rs1 = (instr32 >> 15) & 0x1F;
  const rs2 = (instr32 >> 20) & 0x1F;
  const funct7 = (instr32 >> 25) & 0x7F;
  
  // Decode immediates
  const immI = sext(instr32 >> 20, 12);
  const immS = sext(((instr32 >> 25) << 5) | ((instr32 >> 7) & 0x1F), 12);
  const immB = sext(
    ((instr32 >> 31) << 12) |
    (((instr32 >> 25) & 0x3F) << 5) |
    (((instr32 >> 8) & 0xF) << 1) |
    ((instr32 >> 7) & 1) << 11, 13);
  const immU = instr32 & 0xFFFFF000;
  const immJ = sext(
    ((instr32 >> 31) << 20) |
    (((instr32 >> 21) & 0x3FF) << 1) |
    (((instr32 >> 20) & 1) << 11) |
    ((instr32 >> 12) & 0xFF) << 12, 21);
  
  let nextPC = addr + 4;
  lastInstrCycles = computeCycles(opcode, funct3, funct7);
  
  switch (opcode) {
    case 0b0110111: // LUI
      regs[rd] = immU;
      break;
    case 0b0010111: // AUIPC
      regs[rd] = addr + immU;
      break;
    case 0b1101111: // JAL
      regs[rd] = addr + 4;
      nextPC = addr + immJ;
      break;
    case 0b1100111: // JALR
      regs[rd] = addr + 4;
      nextPC = (regs[rs1] + immI) & ~1;
      break;
    case 0b1100011: // BRANCH
      let taken = false;
      switch (funct3) {
        case 0b000: taken = regs[rs1] === regs[rs2]; break; // BEQ
        case 0b001: taken = regs[rs1] !== regs[rs2]; break; // BNE
        case 0b100: taken = regs[rs1] < regs[rs2]; break; // BLT
        case 0b101: taken = regs[rs1] >= regs[rs2]; break; // BGE
        case 0b110: taken = unsigned(regs[rs1]) < unsigned(regs[rs2]); break; // BLTU
        case 0b111: taken = unsigned(regs[rs1]) >= unsigned(regs[rs2]); break; // BGEU
      }
      if (taken) nextPC = addr + immB;
      lastInstrCycles = taken ? cycleConfig.branchTaken : cycleConfig.branchNotTaken;
      break;
    case 0b0000011: // LOAD
      let loadAddr = regs[rs1] + immI;
      if (rd !== 0) {
        switch (funct3) {
          case 0b000: regs[rd] = readMemSigned(loadAddr, 1); break; // LB
          case 0b001: regs[rd] = readMemSigned(loadAddr, 2); break; // LH
          case 0b010: regs[rd] = readMemSigned(loadAddr, 4); break; // LW
          case 0b100: regs[rd] = readMem(loadAddr, 1); break; // LBU
          case 0b101: regs[rd] = readMem(loadAddr, 2); break; // LHU
        }
      }
      break;
    case 0b0100011: // STORE
      {
        let storeAddr = regs[rs1] + immS;
        switch (funct3) {
          case 0b000: writeMem(storeAddr, regs[rs2] & 0xFF, 1); break; // SB
          case 0b001: writeMem(storeAddr, regs[rs2] & 0xFFFF, 2); break; // SH
          case 0b010: writeMem(storeAddr, regs[rs2], 4); break; // SW
        }
      }
      break;
    case 0b0010011: // ALU IMMEDIATE
      if (rd !== 0) {
        let shamt = rs2 & 0x1F;
        switch (funct3) {
          case 0b000: regs[rd] = regs[rs1] + immI; break; // ADDI
          case 0b010: regs[rd] = regs[rs1] < immI ? 1 : 0; break; // SLTI
          case 0b011: regs[rd] = unsigned(regs[rs1]) < unsigned(immI) ? 1 : 0; break; // SLTIU
          case 0b100: regs[rd] = regs[rs1] ^ immI; break; // XORI
          case 0b110: regs[rd] = regs[rs1] | immI; break; // ORI
          case 0b111: regs[rd] = regs[rs1] & immI; break; // ANDI
          case 0b001: regs[rd] = regs[rs1] << shamt; break; // SLLI
          case 0b101:
            if ((funct7 >> 5) & 1) regs[rd] = regs[rs1] >> shamt; // SRAI
            else regs[rd] = unsigned(regs[rs1]) >>> shamt; // SRLI
            break;
        }
      }
      break;
    case 0b0110011: // ALU REGISTER
      if (rd !== 0) {
        if (funct7 === 0b0000001) {
          switch (funct3) {
            case 0b000: regs[rd] = regs[rs1] * regs[rs2]; break; // MUL
            case 0b001: // MULH
              regs[rd] = mulh(regs[rs1], regs[rs2]); break;
            case 0b010: // MULHSU
              regs[rd] = mulhsu(regs[rs1], regs[rs2]); break;
            case 0b011: // MULHU
              regs[rd] = mulhu(unsigned(regs[rs1]), unsigned(regs[rs2])); break;
            case 0b100: // DIV
              if (regs[rs2] === 0) regs[rd] = -1;
              else regs[rd] = Math.trunc(regs[rs1] / regs[rs2]);
              break;
            case 0b101: // DIVU
              if (regs[rs2] === 0) regs[rd] = -1;
              else regs[rd] = Math.trunc(unsigned(regs[rs1]) / unsigned(regs[rs2]));
              break;
            case 0b110: // REM
              if (regs[rs2] === 0) regs[rd] = regs[rs1];
              else regs[rd] = regs[rs1] % regs[rs2];
              break;
            case 0b111: // REMU
              if (regs[rs2] === 0) regs[rd] = unsigned(regs[rs1]);
              else regs[rd] = unsigned(regs[rs1]) % unsigned(regs[rs2]);
              break;
          }
        } else {
          switch (funct3) {
            case 0b000:
              if (funct7 & 0x20) regs[rd] = regs[rs1] - regs[rs2]; // SUB
              else regs[rd] = regs[rs1] + regs[rs2]; // ADD
              break;
            case 0b001: regs[rd] = regs[rs1] << (rs2 & 0x1F); break; // SLL
            case 0b010: regs[rd] = regs[rs1] < regs[rs2] ? 1 : 0; break; // SLT
            case 0b011: regs[rd] = unsigned(regs[rs1]) < unsigned(regs[rs2]) ? 1 : 0; break; // SLTU
            case 0b100: regs[rd] = regs[rs1] ^ regs[rs2]; break; // XOR
            case 0b101:
              if (funct7 & 0x20) regs[rd] = regs[rs1] >> (rs2 & 0x1F); // SRA
              else regs[rd] = unsigned(regs[rs1]) >>> (rs2 & 0x1F); // SRL
              break;
            case 0b110: regs[rd] = regs[rs1] | regs[rs2]; break; // OR
            case 0b111: regs[rd] = regs[rs1] & regs[rs2]; break; // AND
          }
        }
      }
      break;
    case 0b0000111: // LOAD FP
      if (funct3 === 0b010) { // FLW
        let fAddr = regs[rs1] + immI;
        let bits = readMem(fAddr, 4);
        if (rd < 32) fregs[rd] = new Float32Array(new Int32Array([bits]).buffer)[0];
      } else if (funct3 === 0b011) { // FLD
        let fAddr = regs[rs1] + immI;
        let low = readMem(fAddr, 4);
        let high = readMem(fAddr + 4, 4);
        let bits = (high << 32) | unsigned(low);
        if (rd < 32) dregs[rd] = new Float64Array(new BigInt64Array([BigInt(bits)]).buffer)[0];
      }
      break;
    case 0b0100111: // STORE FP
      if (funct3 === 0b010) { // FSW
        let fAddr = regs[rs1] + immS;
        let bits = new Int32Array(new Float32Array([fregs[rs2]]).buffer)[0];
        writeMem(fAddr, bits, 4);
      } else if (funct3 === 0b011) { // FSD
        let fAddr = regs[rs1] + immS;
        let bits = new BigInt64Array(new Float64Array([dregs[rs2]]).buffer)[0];
        writeMem(fAddr, Number(bits & BigInt(0xFFFFFFFF)), 4);
        writeMem(fAddr + 4, Number((bits >> BigInt(32)) & BigInt(0xFFFFFFFF)), 4);
      }
      break;
    case 0b1010011: // FP OPERATIONS
      executeFP(instr32, rd, funct3, rs1, rs2, funct7);
      break;
    case 0b0101111: // ATOMIC
      executeAtomic(instr32, rd, funct3, rs1, rs2, funct7);
      break;
    case 0b1110011: // SYSTEM
      if (funct3 === 0b000) {
        if (immI === 0) handleECall(); // ECALL
        else if (immI === 1) handleEBreak(); // EBREAK
      }
      break;
    default:
      // Unknown instruction - just advance PC
      break;
  }
  
  regs[0] = 0;
  
  // Track last written register for UI highlighting
  if (rd !== 0 && opcode !== 0b0100011 && opcode !== 0b0100111 && opcode !== 0b1100011) {
    lastExecutedRd = rd;
  }
  
  return nextPC;
}

function unsigned(val) {
  return val >>> 0;
}

function mulh(a, b) {
  return Math.trunc((BigInt(a) * BigInt(b)) >> BigInt(32));
}

function mulhu(a, b) {
  return Number((BigInt(a >>> 0) * BigInt(b >>> 0)) >> BigInt(32));
}

function mulhsu(a, b) {
  return Number((BigInt(a) * BigInt(b >>> 0)) >> BigInt(32));
}

function executeFP(instr32, rd, funct3, rs1, rs2, funct7) {
  // Basic FP operations
  const isDouble = (funct7 & 1) === 1 || funct7 === 0b0100001 || funct7 === 0b0000001 || funct7 === 0b0000101 || 
                    funct7 === 0b0001001 || funct7 === 0b0001101 || funct7 === 0b0101101 ||
                    funct7 === 0b0010001 || funct7 === 0b0010101 || funct7 === 0b1010001 ||
                    funct7 === 0b1110001 || funct7 === 0b1100001 || funct7 === 0b1100011 ||
                    funct7 === 0b1101001 || funct7 === 0b1101011 || funct7 === 0b0100000;
  
  if (isDouble) {
    // D extension
    switch (funct7) {
      case 0b0000001: if (funct3 === 0b000 && rd < 32 && rs1 < 32 && rs2 < 32) dregs[rd] = dregs[rs1] + dregs[rs2]; break; // FADD.D
      case 0b0000101: if (funct3 === 0b000) dregs[rd] = dregs[rs1] - dregs[rs2]; break; // FSUB.D
      case 0b0001001: if (funct3 === 0b000) dregs[rd] = dregs[rs1] * dregs[rs2]; break; // FMUL.D
      case 0b0001101: if (funct3 === 0b000) dregs[rd] = dregs[rs1] / dregs[rs2]; break; // FDIV.D
      case 0b0101101: if (funct3 === 0b000 && rs2 === 0) dregs[rd] = Math.sqrt(dregs[rs1]); break; // FSQRT.D
      case 0b0010101:
        if (funct3 === 0b000) dregs[rd] = Math.min(dregs[rs1], dregs[rs2]); // FMIN.D
        else if (funct3 === 0b001) dregs[rd] = Math.max(dregs[rs1], dregs[rs2]); // FMAX.D
        break;
      case 0b1100001: if (funct3 === 0b000 && rs2 === 0) regs[rd] = Math.trunc(dregs[rs1]); break; // FCVT.W.D
      case 0b1100011: if (funct3 === 0b000 && rs2 === 0) regs[rd] = unsigned(Math.trunc(dregs[rs1])); break; // FCVT.WU.D
      case 0b1101001: if (funct3 === 0b000 && rs2 === 0) dregs[rd] = regs[rs1]; break; // FCVT.D.W
      case 0b1101011: if (funct3 === 0b000 && rs2 === 0) dregs[rd] = unsigned(regs[rs1]); break; // FCVT.D.WU
      case 0b0100000: if (funct3 === 0b000) dregs[rd] = dregs[rs1]; break; // FSGNJ.D (simplified)
      case 0b0010001:
        if (funct3 === 0b000) { // FSGNJ.D
          let bits = new BigInt64Array(new Float64Array([dregs[rs1]]).buffer)[0];
          let bits2 = new BigInt64Array(new Float64Array([dregs[rs2]]).buffer)[0];
          bits = (bits & ~(BigInt(1) << BigInt(63))) | (bits2 & (BigInt(1) << BigInt(63)));
          dregs[rd] = new Float64Array(new BigInt64Array([bits]).buffer)[0];
        } else if (funct3 === 0b001) { // FSGNJN.D
          let bits = new BigInt64Array(new Float64Array([dregs[rs1]]).buffer)[0];
          let bits2 = new BigInt64Array(new Float64Array([dregs[rs2]]).buffer)[0];
          bits = (bits & ~(BigInt(1) << BigInt(63))) | (~bits2 & (BigInt(1) << BigInt(63)));
          dregs[rd] = new Float64Array(new BigInt64Array([bits]).buffer)[0];
        } else if (funct3 === 0b010) { // FSGNJX.D
          let bits = new BigInt64Array(new Float64Array([dregs[rs1]]).buffer)[0];
          let bits2 = new BigInt64Array(new Float64Array([dregs[rs2]]).buffer)[0];
          bits = (bits & ~(BigInt(1) << BigInt(63))) | ((bits ^ bits2) & (BigInt(1) << BigInt(63)));
          dregs[rd] = new Float64Array(new BigInt64Array([bits]).buffer)[0];
        }
        break;
      case 0b1010001:
        if (funct3 === 0b010) regs[rd] = dregs[rs1] === dregs[rs2] ? 1 : 0; // FEQ.D
        else if (funct3 === 0b001) regs[rd] = dregs[rs1] < dregs[rs2] ? 1 : 0; // FLT.D
        else if (funct3 === 0b000) regs[rd] = dregs[rs1] <= dregs[rs2] ? 1 : 0; // FLE.D
        break;
    }
  } else {
    // F extension (single precision)
    switch (funct7) {
      case 0b0000000: if (funct3 === 0b000 && rd < 32 && rs1 < 32 && rs2 < 32) fregs[rd] = fregs[rs1] + fregs[rs2]; break; // FADD.S
      case 0b0000100: if (funct3 === 0b000) fregs[rd] = fregs[rs1] - fregs[rs2]; break; // FSUB.S
      case 0b0001000: if (funct3 === 0b000) fregs[rd] = fregs[rs1] * fregs[rs2]; break; // FMUL.S
      case 0b0001100: if (funct3 === 0b000) fregs[rd] = fregs[rs1] / fregs[rs2]; break; // FDIV.S
      case 0b0101100: if (funct3 === 0b000 && rs2 === 0) fregs[rd] = Math.sqrt(fregs[rs1]); break; // FSQRT.S
      case 0b0010100:
        if (funct3 === 0b000) fregs[rd] = Math.min(fregs[rs1], fregs[rs2]); // FMIN.S
        else if (funct3 === 0b001) fregs[rd] = Math.max(fregs[rs1], fregs[rs2]); // FMAX.S
        break;
      case 0b1100000: if (funct3 === 0b000 && rs2 === 0) regs[rd] = Math.trunc(fregs[rs1]); break; // FCVT.W.S
      case 0b1100001: if (funct3 === 0b000 && rs2 === 0) regs[rd] = unsigned(Math.trunc(fregs[rs1])); break; // FCVT.WU.S
      case 0b1110000: if (funct3 === 0b000) regs[rd] = new Int32Array(new Float32Array([fregs[rs1]]).buffer)[0]; break; // FMV.X.W
      case 0b1101000: if (funct3 === 0b000 && rs2 === 0) fregs[rd] = regs[rs1]; break; // FCVT.S.W
      case 0b1101001: if (funct3 === 0b000 && rs2 === 0) fregs[rd] = unsigned(regs[rs1]); break; // FCVT.S.WU
      case 0b1111000: if (funct3 === 0b000) fregs[rd] = new Float32Array(new Int32Array([regs[rs1]]).buffer)[0]; break; // FMV.W.X
      case 0b0010000:
        if (funct3 === 0b000) { // FSGNJ.S
          let bits = new Int32Array(new Float32Array([fregs[rs1]]).buffer)[0];
          let bits2 = new Int32Array(new Float32Array([fregs[rs2]]).buffer)[0];
          bits = (bits & 0x7FFFFFFF) | (bits2 & 0x80000000);
          fregs[rd] = new Float32Array(new Int32Array([bits]).buffer)[0];
        } else if (funct3 === 0b001) { // FSGNJN.S
          let bits = new Int32Array(new Float32Array([fregs[rs1]]).buffer)[0];
          let bits2 = new Int32Array(new Float32Array([fregs[rs2]]).buffer)[0];
          bits = (bits & 0x7FFFFFFF) | (~bits2 & 0x80000000);
          fregs[rd] = new Float32Array(new Int32Array([bits]).buffer)[0];
        } else if (funct3 === 0b010) { // FSGNJX.S
          let bits = new Int32Array(new Float32Array([fregs[rs1]]).buffer)[0];
          let bits2 = new Int32Array(new Float32Array([fregs[rs2]]).buffer)[0];
          bits = (bits & 0x7FFFFFFF) | ((bits ^ bits2) & 0x80000000);
          fregs[rd] = new Float32Array(new Int32Array([bits]).buffer)[0];
        }
        break;
      case 0b1010000:
        if (funct3 === 0b010) regs[rd] = fregs[rs1] === fregs[rs2] ? 1 : 0; // FEQ.S
        else if (funct3 === 0b001) regs[rd] = fregs[rs1] < fregs[rs2] ? 1 : 0; // FLT.S
        else if (funct3 === 0b000) regs[rd] = fregs[rs1] <= fregs[rs2] ? 1 : 0; // FLE.S
        break;
      case 0b1110001: if (funct3 === 0b001) regs[rd] = fclass(fregs[rs1]); break; // FCLASS.S
    }
  }
}

function fclass(f) {
  let cls = 0;
  if (isNaN(f)) cls |= 0x100;
  else if (f === Infinity) cls |= 0x200;
  else if (f === -Infinity) cls |= 0x001;
  else if (f === 0) { cls |= (1 / f < 0) ? 0x008 : 0x010; }
  else if (f > 0) cls |= 0x040;
  else cls |= 0x002;
  return cls;
}

function executeAtomic(instr32, rd, funct3, rs1, rs2, funct7) {
  if (funct3 !== 0b010) return;
  const aq = (instr32 >> 26) & 1;
  const rl = (instr32 >> 25) & 1;
  const addr = regs[rs1];
  const memVal = readMem(addr, 4);
  
  switch (funct7 >>> 0) {
    case 0b00010: // LR.W
      if (rd !== 0) regs[rd] = memVal;
      break;
    case 0b00011: // SC.W
      writeMem(addr, regs[rs2], 4);
      regs[rd] = 0; // Success
      break;
    case 0b00001: // AMOSWAP.W
      if (rd !== 0) regs[rd] = memVal;
      writeMem(addr, regs[rs2], 4);
      break;
    case 0b00000: // AMOADD.W
      if (rd !== 0) regs[rd] = memVal;
      writeMem(addr, memVal + regs[rs2], 4);
      break;
    case 0b00100: // AMOXOR.W
      if (rd !== 0) regs[rd] = memVal;
      writeMem(addr, memVal ^ regs[rs2], 4);
      break;
    case 0b01100: // AMOAND.W
      if (rd !== 0) regs[rd] = memVal;
      writeMem(addr, memVal & regs[rs2], 4);
      break;
    case 0b01000: // AMOOR.W
      if (rd !== 0) regs[rd] = memVal;
      writeMem(addr, memVal | regs[rs2], 4);
      break;
    case 0b10000: // AMOMIN.W
      if (rd !== 0) regs[rd] = memVal;
      writeMem(addr, Math.min(memVal, regs[rs2]), 4);
      break;
    case 0b10100: // AMOMAX.W
      if (rd !== 0) regs[rd] = memVal;
      writeMem(addr, Math.max(memVal, regs[rs2]), 4);
      break;
    case 0b11000: // AMOMINU.W
      if (rd !== 0) regs[rd] = memVal;
      writeMem(addr, Math.min(unsigned(memVal), unsigned(regs[rs2])), 4);
      break;
    case 0b11100: // AMOMAXU.W
      if (rd !== 0) regs[rd] = memVal;
      writeMem(addr, Math.max(unsigned(memVal), unsigned(regs[rs2])), 4);
      break;
  }
}

function handleECall() {
  // Simple ECALL handling for simulation
  const a7 = regs[17]; // x17 = a7
  switch (a7) {
    case 1: // print int (a0)
      log(`[ECALL] print_int: ${regs[10]}`, 'info');
      ioOutputBuffer += regs[10];
      break;
    case 4: // print string (a0 = address)
      {
        let s = '';
        let addr = regs[10];
        while (addr < memory.length && memory[addr] !== 0) {
          s += String.fromCharCode(memory[addr]);
          addr++;
        }
        log(`[ECALL] print_str: ${s}`, 'info');
        ioOutputBuffer += s;
      }
      break;
    case 5: // read int
      log('[ECALL] read_int', 'warn');
      regs[10] = 0;
      break;
    case 10: // exit
      log('[ECALL] Program exit', 'warn');
      running = false;
      break;
    default:
      log(`[ECALL] unhandled ecall #${a7}`, 'warn');
  }
}

function handleEBreak() {
  log('[EBREAK] Breakpoint hit', 'warn');
  running = false;
}

const editor = document.getElementById('asmEditor');
const highlightLayer = document.getElementById('highlightLayer');
const lineNumbers = document.getElementById('lineNumbers');
const consoleEl = document.getElementById('console');
const regBody = document.getElementById('regBody');
const memView = document.getElementById('memView');
const machineCodeDisplay = document.getElementById('machineCodeDisplay');
const statusBar = document.getElementById('statusBar');

function log(msg, type = 'info') {
  const div = document.createElement('div');
  div.className = type;
  div.textContent = msg;
  consoleEl.appendChild(div);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

function clearLog() {
  consoleEl.innerHTML = '';
}

function setStatus(msg, type = '') {
  statusBar.textContent = msg;
  statusBar.style.color = type === 'error' ? '#ff9ab0' : type === 'success' ? '#b6efb2' : '#c4cae4';
}

function syncScroll() {
  highlightLayer.scrollTop = editor.scrollTop;
  highlightLayer.scrollLeft = editor.scrollLeft;
  lineNumbers.scrollTop = editor.scrollTop;
}

function currentSourceLine() {
  for (const item of machineCode) {
    if (item.bytes && item.address === pc) return item.line;
  }
  return 0;
}

function syncBreakpoints() {
  breakpointAddrs.clear();
  for (const item of machineCode) {
    if (item.bytes && breakpointLines.has(item.line)) {
      breakpointAddrs.add(item.address);
    }
  }
}

function toggleBreakpoint(line) {
  if (breakpointLines.has(line)) breakpointLines.delete(line);
  else breakpointLines.add(line);
  syncBreakpoints();
  updateLineNumbers();
  setStatus(breakpointLines.has(line) ? 'Breakpoint set on line ' + line : 'Breakpoint cleared on line ' + line);
}

function updateLineNumbers() {
  const lines = editor.value.split('\n');
  const currentLine = currentSourceLine();
  let html = '';
  for (let i = 1; i <= lines.length; i++) {
    const isBp = breakpointLines.has(i);
    const isCur = (i === currentLine);
    const isErr = errorLines.has(i);
    let rowCls = 'ln';
    if (isBp) rowCls += ' ln-break';
    if (isCur) rowCls += ' ln-current';
    if (isErr) rowCls += ' ln-error';
    const marker = isBp ? '●' : (isCur ? '▶' : '');
    const markerCls = isBp ? 'ln-bp' : (isCur ? 'ln-pc' : 'ln-bp');
    html += `<div class="${rowCls}" data-line="${i}" title="${isBp ? 'Click to remove breakpoint' : 'Click to set breakpoint'}">` +
            `<span class="${markerCls}">${marker}</span><span class="ln-num">${i}</span></div>`;
  }
  lineNumbers.innerHTML = html;
}

function highlightSyntax() {
  const code = editor.value;
  const lines = code.split('\n');
  let html = '';
  
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];
    if (i > 0) html += '\n';
    
    const commentMatch = line.match(/^(.*?)(#.*)$/);
    let mainPart = line;
    let commentPart = '';
    if (commentMatch) {
      mainPart = commentMatch[1];
      commentPart = commentMatch[2];
    }
    
    const labelMatch = mainPart.match(/^(\s*)(\w+)(\s*:\s*)(.*)$/i);
    if (labelMatch) {
      html += escapeHtml(labelMatch[1]);
      html += '<span class="hl-label">' + escapeHtml(labelMatch[2]) + '</span>';
      html += '<span class="hl-punctuation">:</span>';
      const rest = labelMatch[3] + labelMatch[4];
      html += highlightInstructionPart(rest);
      if (commentPart) html += '<span class="hl-comment">' + escapeHtml(commentPart) + '</span>';
      continue;
    }
    
    const dirMatch = mainPart.match(/^(\s*)(\.\w+)(.*)$/i);
    if (dirMatch) {
      html += escapeHtml(dirMatch[1]);
      html += '<span class="hl-directive">' + escapeHtml(dirMatch[2]) + '</span>';
      html += highlightInstructionPart(dirMatch[3]);
      if (commentPart) html += '<span class="hl-comment">' + escapeHtml(commentPart) + '</span>';
      continue;
    }
    
    html += highlightInstructionPart(mainPart);
    
    if (commentPart) {
      html += '<span class="hl-comment">' + escapeHtml(commentPart) + '</span>';
    }
  }
  
  highlightLayer.innerHTML = html;
}

function highlightInstructionPart(s) {
  let result = '';
  const tokens = s.split(/(\b[a-zA-Z_]\w*\b|"[^"]*"|'[^']*'|-?\b\d+\b|0x[0-9a-fA-F]+|[,()])/g);
  
  for (const token of tokens) {
    if (!token) continue;
    if (/^[,'"()]$/.test(token)) {
      result += '<span class="hl-punctuation">' + escapeHtml(token) + '</span>';
    } else if (/^"[^"]*"$/.test(token) || /^'[^']*'$/.test(token)) {
      result += '<span class="hl-string">' + escapeHtml(token) + '</span>';
    } else if (/^0x[0-9a-fA-F]+$/.test(token) || /^-?\d+$/.test(token)) {
      result += '<span class="hl-number">' + escapeHtml(token) + '</span>';
    } else if (/^x\d+$/i.test(token) || /^f\d+$/i.test(token) || REG_NAMES[token.toLowerCase()] !== undefined) {
      result += '<span class="hl-register">' + escapeHtml(token) + '</span>';
    } else if (INSTRUCTIONS[token.toLowerCase()] || PSEUDO_INSTRUCTIONS[token.toLowerCase()]) {
      result += '<span class="hl-instruction">' + escapeHtml(token) + '</span>';
    } else {
      result += escapeHtml(token);
    }
  }
  
  return result;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function updateEditor() {
  updateLineNumbers();
  highlightSyntax();
  const src = editor.value;
  if (src.trim()) {
    try {
      const mc = assemble(src);
      machineCode = mc;
      syncBreakpoints();
      updateMachineCode();

      const errs = mc.filter(i => i.error);
      errorLines.clear();
      for (const e of errs) errorLines.add(e.line);

      const sig = errs.map(e => e.line + ':' + e.error).join(' | ');
      if (sig !== lastErrorsSignature) {
        lastErrorsSignature = sig;
        clearLog();
        if (errs.length) {
          log('⚠ Assembling: ' + errs.length + ' syntax error(s)', 'error');
          for (const e of errs.slice(0, 6)) log('  Line ' + e.line + ': ' + e.error, 'error');
          if (errs.length > 6) log('  … and ' + (errs.length - 6) + ' more', 'error');
        } else {
          log('Assembled OK — ' + mc.filter(i => i.bytes).length + ' instruction(s)', 'success');
        }
      }

      const n = mc.filter(i => i.bytes).length;
      if (errs.length) {
        setStatus(errs.length + ' syntax error' + (errs.length > 1 ? 's' : '') + ': Line ' + errs[0].line + ' — ' + errs[0].error, 'error');
      } else {
        setStatus('Assembled ' + n + ' instruction(s) — no errors', 'success');
      }
    } catch (e) {
      errorLines.clear();
      setStatus('Assembler error: ' + e.message, 'error');
    }
    updateLineNumbers(); // redraw gutter with error markers
  } else {
    errorLines.clear();
    lastErrorsSignature = '';
    setStatus('Ready — type some assembly above');
  }
}

function updateRegisters() {
  let html = '';
  for (let i = 0; i < 32; i++) {
    const name = ABI_NAMES[i];
    const val = regs[i];
    const uval = val >>> 0;
    const isChanged = i === lastChangedReg;
    const valClass = isChanged ? 'reg-changed' : 'reg-val';
    html += `<tr><td class="reg-name">x${i}</td><td class="reg-name">${name}</td>
      <td class="${valClass}">0x${uval.toString(16).padStart(8,'0')}</td>
      <td class="${valClass}">${val}</td></tr>`;
  }
  regBody.innerHTML = html;
}

function memGo(region) {
  const el = document.getElementById('memAddr');
  if (region === 'code') el.value = '0x10000';
  else if (region === 'data') el.value = '0x' + DATA_BASE.toString(16);
  else if (region === 'stack') el.value = '0x7FFE0';
  else if (region === 'mmio') el.value = '0x10000000';
  updateMemoryView();
  setStatus('Memory view: ' + el.value);
}

function updateMemoryView() {
  const addrStr = document.getElementById('memAddr').value;
  const rows = parseInt(document.getElementById('memRows').value) || 16;
  let addr = parseInt(addrStr, 16);
  if (isNaN(addr)) addr = 0x10000;
  addr = addr & ~0xF;

  // Reverse map: label-name -> address (labels are set during assembly)
  const labelAt = {};
  for (const n in labels) {
    if (labels.hasOwnProperty(n)) labelAt[labels[n]] = n;
  }

  let html = '';
  for (let r = 0; r < rows; r++) {
    const base = addr + r * 16;
    if (base >= memory.length) break;

    let hexVals = '';
    let asciiVals = '';
    for (let c = 0; c < 16; c++) {
      const offset = base + c;
      if (offset >= memory.length) break;
      const val = memory[offset];
      const isChanged = lastChangedMem.some(m => offset >= m.addr && offset < m.addr + m.size);
      const cls = isChanged ? ' changed' : '';
      hexVals += `<span class="val${cls}">${val.toString(16).padStart(2,'0')}</span>`;
      if (c === 7) hexVals += '<span class="wordgap"></span>';
      const ch = val >= 32 && val <= 126 ? String.fromCharCode(val) : '.';
      asciiVals += `<span class="ascii${cls}">${escapeHtml(ch)}</span>`;
    }
    const label = labelAt[base] ? `<span class="mem-label">${escapeHtml(labelAt[base])}:</span>` : '';
    html += `<div><span class="addr">0x${base.toString(16).padStart(8,'0')}</span>  ${hexVals}  ${asciiVals}${label}</div>`;
  }
  memView.innerHTML = html;
}

function updateMachineCode() {
  const showHex = document.getElementById('showHex').checked;
  const showBinary = document.getElementById('showBinary').checked;
  
  let html = '<table style="width:100%;border-collapse:collapse;font-size:13px;">';
  html += '<tr><th style="text-align:left;padding:2px 6px;">Addr</th><th style="text-align:left;padding:2px 6px;">Bytes</th><th style="text-align:left;padding:2px 6px;">Source</th></tr>';
  
  for (const item of machineCode) {
    if (!item.bytes) continue;
    let bytesStr = '';
    if (showHex) {
      bytesStr = Array.from(item.bytes).map(b => b.toString(16).padStart(2,'0')).join(' ');
      if (showBinary) bytesStr += ' ';
    }
    if (showBinary) {
      if (item.bytes.length === 4) {
        const val = ((item.bytes[3] << 24) | (item.bytes[2] << 16) | (item.bytes[1] << 8) | item.bytes[0]) >>> 0;
        bytesStr += val.toString(2).padStart(32,'0');
      } else {
        bytesStr += Array.from(item.bytes).map(b => b.toString(2).padStart(8,'0')).join(' ');
      }
    }
    
    const errClass = item.error ? ' style="color:#ff9ab0;"' : '';
    html += `<tr${errClass}>
      <td style="color:#9aa3c4;padding:1px 6px;">0x${item.address.toString(16).padStart(8,'0')}</td>
      <td style="color:#f7c8e8;padding:1px 6px;font-family:monospace;">${escapeHtml(bytesStr)}</td>
      <td style="color:#c4cae4;padding:1px 6px;">${escapeHtml(item.text || item.asmLine || '')}</td>
    </tr>`;
  }
  html += '</table>';
  machineCodeDisplay.innerHTML = html;
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-bar button').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  btn.classList.add('active');
  if (tab === 'memory') updateMemoryView();
  if (tab === 'machine') updateMachineCode();
}

const CYCLE_FIELD_DEFS = [
  ['alu', 'ALU / Shift / LUI / AUIPC'],
  ['mul', 'Multiply (MUL / MULH…)'],
  ['div', 'Divide / Remainder (DIV / REM…)'],
  ['load', 'Load (LW / LH / FLW / FLD)'],
  ['store', 'Store (SW / SH / FSW / FSD)'],
  ['branchTaken', 'Branch Taken'],
  ['branchNotTaken', 'Branch Not Taken'],
  ['jump', 'Jumps (JAL / JALR)'],
  ['fp', 'Floating-Point Ops'],
  ['atomic', 'Atomic (AMO)'],
  ['system', 'System (ECALL / EBREAK)']
];

function buildCyclesPanel() {
  const body = document.getElementById('cyclesConfigBody');
  let html = '<div class="cycle-hint">Applied live — changes take effect on the next instruction executed. Branch-taken cost replaces the normal branch cost.</div>';
  for (const [key, label] of CYCLE_FIELD_DEFS) {
    html += `<div class="cycle-field"><label for="cf-${key}">${label}</label>` +
            `<input id="cf-${key}" type="number" min="1" max="1000" value="${cycleConfig[key]}"></div>`;
  }
  body.innerHTML = html;
  for (const [key] of CYCLE_FIELD_DEFS) {
    document.getElementById('cf-' + key).addEventListener('change', e => {
      const v = parseInt(e.target.value, 10);
      cycleConfig[key] = (v > 0 && v <= 1000) ? v : 1;
      e.target.value = cycleConfig[key];
    });
  }
}

function toggleCyclesPanel() {
  const ov = document.getElementById('cyclesOverlay');
  if (ov.style.display === 'none') {
    buildCyclesPanel();
    ov.style.display = 'flex';
  } else {
    closeCyclesPanel();
  }
}

function closeCyclesPanel() {
  document.getElementById('cyclesOverlay').style.display = 'none';
}

function resetCyclesConfig() {
  cycleConfig = Object.assign({}, DEFAULT_CYCLE_CONFIG);
  buildCyclesPanel();
  setStatus('Cycle configuration reset to defaults');
}

function updateCycleBadge() {
  const el = document.getElementById('cycleBadge');
  if (el) el.innerHTML = '⏱ <b>' + totalCycles + '</b> cycles';
}

main:

loop:

    j     loop
    
done:
    li    x28, 0x20000   # data segment base
    sw    x2, 0(x28)     # store result to data[0]
    j     done
`,

    loop: `# Loop with Memory Access
# Sum array elements
.text
main:
    # Initialize array in memory
    addi  x1, x0, 10     # x1 = 10
    addi  x2, x0, 20     # x2 = 20
    addi  x3, x0, 30     # x3 = 30
    addi  x4, x0, 40     # x4 = 40
    addi  x5, x0, 50     # x5 = 50
    
    li    x28, 0x20000   # data segment base
    sw    x1, 0(x28)     # array[0]
    sw    x2, 4(x28)     # array[1]
    sw    x3, 8(x28)     # array[2]
    sw    x4, 12(x28)    # array[3]
    sw    x5, 16(x28)    # array[4]
    
    # Sum them
    addi  x6, x0, 0      # sum = 0
    addi  x7, x0, 5      # count = 5
    addi  x8, x0, 0      # index = 0
    
sum_loop:
    beq   x8, x7, finish # if index == count, done
    add   x30, x28, x8   # address of array[index]
    lw    x9, 0(x30)     # load array[index]
    add   x6, x6, x9     # sum += value
    addi  x8, x8, 4      # index += 4
    j     sum_loop
    
finish:
    sw    x6, 20(x28)    # store sum at data[20]
    j     finish
`,

    io: `# I/O Demo with M Multiplication
# Read from MMIO and multiply
.text
main:
    addi  x1, x0, 7      # x1 = 7
    addi  x2, x0, 8      # x2 = 8
    
    mul   x3, x1, x2     # x3 = 7 * 8 = 56
    div   x4, x3, x2     # x4 = 56 / 8 = 7
    rem   x5, x3, x1     # x5 = 56 % 7 = 0
    
    li    x28, 0x20000   # data segment base
    sw    x3, 0(x28)     # Store results
    sw    x4, 4(x28)
    sw    x5, 8(x28)
    
    # Test with compressed-style simple loop
    addi  x6, x0, 10     # counter = 10
count_loop:
    addi  x6, x6, -1     # counter--
    bne   x6, x0, count_loop
    
    sw    x6, 12(x28)    # counter should be 0
    
    # Floating point demo
    li    x10, 0x40A0      # 5.0 in IEEE 754 single precision
    li    x11, 0x4120      # 10.0
    # Store and load as floats (simulated)
    sw    x10, 0x100(x28)
    sw    x11, 0x104(x28)
    
    j     end
end:
    j     end
`
  };
  
  editor.value = examples[name] || examples.basic;
  updateEditor();
  clearLog();
  setStatus('Example loaded: ' + name);
}

// ============================================================
// 7. MAIN CONTROL
// ============================================================

function runProgram() {
  if (running) return;
  clearLog();
  resetState();
  assembled = false;

  const source = editor.value;
  if (!source.trim()) {
    log('No assembly code to assemble.', 'error');
    setStatus('Error: No code', 'error');
    return;
  }

  let mc;
  try {
    log('Assembling...', 'info');
    mc = assemble(source);
    machineCode = mc;

    let hasError = false;
    for (const item of mc) {
      if (item.error) {
        log(`Line ${item.line}: ${item.error}`, 'error');
        hasError = true;
      }
    }

    if (hasError) {
      setStatus('Assembly failed', 'error');
      updateMachineCode();
      return;
    }

    loadProgram(mc);
    updateMachineCode();
    assembled = true;
    syncBreakpoints();
  } catch (e) {
    log(`Assembly error: ${e.message}`, 'error');
    setStatus('Error: ' + e.message, 'error');
    return;
  }

  log(`Assembly successful. ${mc.length} instructions.`, 'success');
  runLoop();
}

async function runLoop() {
  running = true;
  setStatus('Running...');
  document.getElementById('runBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = '';

  const MAX_RC = 100000;
  let guard = 0;
  let executedAny = false;
  let stopReason = null;

  while (running) {
    const instr32 = fetchInstruction(pc);
    if (instr32 === 0) {
      pc += 4;
      totalCycles += cycleConfig.alu;
      guard++;
      if (pc >= memory.length) { stopReason = 'end'; break; }
      if (executedAny && breakpointAddrs.has(pc)) { stopReason = 'breakpoint'; break; }
      if (guard >= MAX_RC) { stopReason = 'max'; break; }
      continue;
    }

    try {
      pc = decodeAndExecute(instr32, pc);
    } catch (e) {
      log(`Error at PC 0x${pc.toString(16)}: ${e.message}`, 'error');
      stopReason = 'error';
      break;
    }

    totalCycles += lastInstrCycles;
    guard++;
    lastChangedReg = lastExecutedRd;
    executedAny = true;

    if (pc < 0x10000 || pc >= memory.length) {
      log(`PC out of bounds: 0x${pc.toString(16)}`, 'error');
      stopReason = 'bounds';
      break;
    }
    if (breakpointAddrs.has(pc)) {
      log(`Breakpoint hit at 0x${pc.toString(16)}`, 'warn');
      stopReason = 'breakpoint';
      break;
    }
    if (guard >= MAX_RC) { stopReason = 'max'; break; }

    // Yield to keep the UI responsive and the cycle badge live
    if (guard % 1500 === 0) {
      updateCycleBadge();
      updateRegisters();
      updateMemoryView();
      updateLineNumbers();
      await new Promise(r => setTimeout(r, 0));
      if (!running) break;
    }
  }

  running = false;
  document.getElementById('runBtn').style.display = '';
  document.getElementById('stopBtn').style.display = 'none';

  updateCycleBadge();
  updateRegisters();
  updateMemoryView();
  updateLineNumbers();

  if (stopReason === 'breakpoint') {
    setStatus(`Paused at breakpoint — ${totalCycles} cycles`, 'warn');
  } else if (stopReason === 'max') {
    log('Max instructions reached. Program may have an infinite loop.', 'warn');
    setStatus('Stopped (max instructions)', 'warn');
  } else if (stopReason === 'error' || stopReason === 'bounds') {
    setStatus('Stopped (error)', 'error');
  } else {
    log(`Program completed in ${totalCycles} cycles.`, 'success');
    setStatus(`Finished — ${totalCycles} cycles`, 'success');
  }
}

function stopProgram() {
  running = false;
  setStatus('Stopping...');
}

function stepOnce() {
  if (!assembled) {
    clearLog();
    resetState();
    
    const source = editor.value;
    if (!source.trim()) {
      log('No code to step.', 'error');
      return;
    }
    
    try {
      const mc = assemble(source);
      machineCode = mc;
      let hasError = false;
      for (const item of mc) {
        if (item.error) {
          log(`Line ${item.line}: ${item.error}`, 'error');
          hasError = true;
        }
      }
      if (hasError) {
        setStatus('Assembly failed', 'error');
        updateMachineCode();
        return;
      }
      loadProgram(mc);
      syncBreakpoints();
      updateMachineCode();
      assembled = true;
      log('Assembly loaded. Stepping...', 'info');
    } catch (e) {
      log(`Assembly error: ${e.message}`, 'error');
      return;
    }
  }
  
  const instr32 = fetchInstruction(pc);
  if (instr32 === 0) {
    log(`PC 0x${pc.toString(16)}: NOP (skipping)`, 'info');
    pc += 4;
    totalCycles += cycleConfig.alu;
    updateCycleBadge();
    updateLineNumbers();
    updateRegisters();
    updateMemoryView();
    setStatus(`Step: PC = 0x${pc.toString(16)} (${totalCycles} cycles)`);
    return;
  }
  
  try {
    const oldPc = pc;
    pc = decodeAndExecute(instr32, pc);
    lastChangedReg = lastExecutedRd;
    totalCycles += lastInstrCycles;
    updateCycleBadge();
    log(`0x${oldPc.toString(16)}: executed (next: 0x${pc.toString(16)}, +${lastInstrCycles}c)`, 'info');
    updateLineNumbers();
    updateRegisters();
    updateMemoryView();
    setStatus(`Step: PC = 0x${pc.toString(16)} (${totalCycles} cycles)`);
  } catch (e) {
    log(`Error at PC 0x${pc.toString(16)}: ${e.message}`, 'error');
  }
}

function resetAll() {
  resetState();
  clearLog();
  assembled = false;
  setStatus('Reset');
}

function resetState() {
  initializeState();
  updateRegisters();
  updateMemoryView();
  machineCode = [];
  updateMachineCode();
  updateLineNumbers();
  updateCycleBadge();
}

// ============================================================
// 8. INITIALIZATION
// ============================================================

// Load file from file input
function loadFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    editor.value = e.target.result;
    updateEditor();
    clearLog();
    log(`Loaded file: ${file.name}`, 'success');
    setStatus('File loaded: ' + file.name);
  };
  reader.onerror = function() {
    log('Error reading file: ' + file.name, 'error');
    setStatus('Error loading file', 'error');
  };
  reader.readAsText(file);
  
  // Reset the file input so the same file can be loaded again
  event.target.value = '';
}

updateEditor();

setStatus('Ready. Assemble & Run or Step through code.');
log('RISC-V RV32GC Simulator loaded', 'success');
log('Supports: RV32I, M, F, D, A extensions', 'info');
log('Click line numbers to set breakpoints; Run stops at them.', 'info');

// Wire up breakpoint toggling on the line-number gutter
lineNumbers.addEventListener('click', function(e) {

// Tab key handling in the assembly editor: insert / remove indentation instead
// of letting the browser move focus out of the textarea.
function handleEditorKeydown(e) {
  if (e.key !== 'Tab') return;
  e.preventDefault();

  const el = editor;
  const { value } = el;
  const start = el.selectionStart;
  const end = el.selectionEnd;
  const indent = '\t';

  const lineStartOf = ch => value.lastIndexOf('\n', ch - 1) + 1;
  const lineEndOf = ch => {
    const nl = value.indexOf('\n', ch);
    return nl === -1 ? value.length : nl;
  };

  if (e.shiftKey) {
    // Dedent every selected line by one indentation level.
    const blockStart = lineStartOf(start);
    const blockEnd = lineEndOf(end);
    const newBlock = value.slice(blockStart, blockEnd).split('\n').map(l => {
      if (l.startsWith('\t')) return l.slice(1);
      if (l.startsWith('    ')) return l.slice(4);
      if (l.startsWith(' ')) return l.slice(1);
      return l;
    }).join('\n');
    el.value = value.slice(0, blockStart) + newBlock + value.slice(blockEnd);
    el.setSelectionRange(blockStart, blockStart + newBlock.length);
  } else if (start === end) {
    // Single caret: just insert one indentation level.
    el.value = value.slice(0, start) + indent + value.slice(end);
    el.setSelectionRange(start + indent.length, start + indent.length);
  } else {
    // Multi-line (or in-line span) selection: indent every selected line.
    const blockStart = lineStartOf(start);
    const blockEnd = lineEndOf(end);
    const newBlock = value.slice(blockStart, blockEnd).split('\n').map(l => indent + l).join('\n');
    el.value = value.slice(0, blockStart) + newBlock + value.slice(blockEnd);
    el.setSelectionRange(blockStart, blockStart + newBlock.length);
  }

  updateEditor();
  syncScroll();
}

editor.addEventListener('keydown', handleEditorKeydown);

buildCyclesPanel();
updateCycleBadge();
